name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - name: Verify pinned semantic-flag sources
        run: ./tools/verify-semantic-flag-sources.sh
