name: Update entity data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: Sync and validate entity-data
        run: ./tools/sync-entity-data.sh
      - name: Verify pinned semantic-flag sources
        run: ./tools/verify-semantic-flag-sources.sh
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/entity-data
          delete-branch: true
          commit-message: "chore(data): update entity metadata"
          title: "chore(data): update entity metadata"
          body: |
            Automated update from [kennytv entity-data](https://kennytv.eu/entity-data/).

            The sync script validates the version index and every entity field before committing.
          labels: dependencies
