name: Update entity data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v6
      - name: Sync and validate entity-data
        run: ./tools/sync-entity-data.sh
      - name: Verify pinned semantic-flag sources
        run: ./tools/verify-semantic-flag-sources.sh
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/entity-data
          delete-branch: true
          commit-message: "chore(data): update entity metadata"
          title: "chore(data): update entity metadata"
          body: |
            Automated update from [kennytv entity-data](https://kennytv.eu/entity-data/).

            The sync script validates the version index and every entity field before committing.
          labels: dependencies
