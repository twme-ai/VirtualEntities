name: Legacy Mineflayer E2E

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify legacy metadata source pins
        run: ./tools/verify-legacy-entity-data-sources.sh

  paper:
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft-version: 1.9.4
            paper-build: 775
          - minecraft-version: 1.12.2
            paper-build: 1620
          - minecraft-version: 1.13.2
            paper-build: 657
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integration/mineflayer/package-lock.json
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
      - name: Build the Java 17 integration artifact
        run: ./gradlew legacyIntegrationPluginJar
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Verify and run on Java 17
        env:
          VE_LEGACY_VERSION: ${{ matrix.minecraft-version }}
          VE_LEGACY_PAPER_BUILD: ${{ matrix.paper-build }}
        run: |
          test "$(javap -verbose -classpath build/libs/VirtualEntitiesLegacyIntegration.jar io.github.twme.virtualentities.integration.legacy.VirtualEntitiesLegacyIntegrationPlugin | awk '/major version/{print $3}')" = 61
          java -version
          ./integration/mineflayer/run-legacy-e2e.sh
