name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  modern-e2e:
    uses: ./.github/workflows/e2e.yml

  legacy-e2e:
    uses: ./.github/workflows/legacy-e2e.yml

  release:
    needs: [modern-e2e, legacy-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
      - run: ./gradlew build
      - uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          generate_release_notes: true
          files: |
            build/libs/*.jar
