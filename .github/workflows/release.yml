name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  modern-e2e:
    uses: ./.github/workflows/e2e.yml

  legacy-e2e:
    uses: ./.github/workflows/legacy-e2e.yml

  release:
    needs: [modern-e2e, legacy-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - run: ./gradlew build
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            build/libs/*.jar
